# IaC Git SoT catalog — used by Aiden route-iac-repo (discover → score → act/ask)
# Keep in sync with GitLab group stackgen-group.
group: stackgen-group
defaults:
  region: us-east-1
  env: dev
  tags:
    Owner: platform
    ManagedBy: aiden
    CostCenter: FE-DEMO

# One gate, applied at every lifecycle step (fail-closed). CDK is synthesized to
# CloudFormation first, then scanned with the same gate.
governance:
  engine: governance/scan-cfn.sh
  cdk_synth: governance/synth-cdk.sh
  gates:
    cspm: trivy config (public/unencrypted S3, SSH from world, star-star IAM)
    mandatory_tags: [Owner, CostCenter, Environment]
    region: us-east-1 only
  intent_target: stackgen-group/field-engineering   # intent -> CloudFormation -> scan -> PR here

repos:
  - project_id: stackgen-group/field-engineering
    gitlab_id: 84661149
    kind: platform-cfn
    description: Live EKS platform CloudFormation + default target for authored-intent CFN (networking, eks-cluster, logs, ingress, appstacks)
    signals:
      names: [field-engineering, eks, platform, cluster]
      paths:
        - cloudformation/appstacks/eks-cluster/template.yaml
        - cloudformation/appstacks/networking/template.yaml
        - cloudformation/appstacks/cluster-logs/template.yaml
      resource_types: [AWS::EKS::Cluster, AWS::EC2::SecurityGroup, AWS::S3::Bucket]
      intents:
        - lock down EKS API / PublicAccessCidrs / cluster endpoint
        - SSH / port 22 / breakglass SG
        - private cluster logs bucket
    file_hints:
      eks_api: cloudformation/appstacks/eks-cluster/template.yaml
      ssh_sg: cloudformation/appstacks/networking/template.yaml
      cluster_logs: cloudformation/appstacks/cluster-logs/template.yaml

  - project_id: stackgen-group/aiden-aws-cloudformation
    gitlab_id: 84657713
    kind: app-cfn
    description: App CloudFormation appstacks (checkout, cart, otel)
    signals:
      names: [aiden-aws-cloudformation, cloudformation, checkout, cart, otel]
      paths:
        - cloudformation/appstacks/*/template.yaml
      resource_types: [AWS::SQS::Queue, AWS::SNS::Topic, AWS::Lambda::Function, AWS::S3::Bucket]
      intents:
        - checkout / cart / order queue / DLQ
        - app CFN template change
    file_hints:
      app: cloudformation/appstacks/<app>/template.yaml
      checkout: cloudformation/appstacks/checkout/template.yaml
      # NEVER get_file_contents on directories (cloudformation/, appstacks/) — GitLab MCP 404s

  - project_id: stackgen-group/cdk
    gitlab_id: 84671456
    kind: cdk
    description: CDK app (Python, from aws-cdk-examples). ALWAYS synth to CloudFormation, then scan.
    synth_first: true
    signals:
      names: [cdk, construct, synth, python]
      paths:
        - app.py
        - cdk.json
        - stacks/*.py
        - fm_constructs/*.py
      resource_types: [aws-cdk-lib, SecureBucket, DlqQueue, Bucket, Queue, Function]
      intents:
        - CDK / construct / synth / Python stack
        - direct PR to cdk repo
    file_hints:
      app: app.py
      stack: stacks/<name>_stack.py
      building_blocks: fm_constructs/
      # governance = CI cdk-synth -> governance-scan (Trivy CSPM + Rego tags/region)

  - project_id: stackgen-group/aiden-aws-cdk
    gitlab_id: 84663981
    kind: app-cdk-legacy
    description: Legacy AWS CDK (TypeScript). Synth → CFN governance.
    synth_first: true
    signals:
      names: [aiden-aws-cdk, cdk, construct, typescript]
      paths:
        - lib/*-stack.ts
        - cdk.json
        - bin/
      resource_types: [aws-cdk-lib, Bucket, Queue, Function]
      intents:
        - legacy CDK / TypeScript stack change
    file_hints:
      s3: lib/s3-assets-stack.ts
      default: lib/

scoring:
  clear_winner_min: 70
  clear_margin: 15
  ask_when: [greenfield, ambiguous]
