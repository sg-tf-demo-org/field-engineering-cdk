# ============================================================================
# cdk (AWS CDK Python) — GOVERNANCE BACKSTOP pipeline.
#
# PRIMARY gate is now SHIFT-LEFT / PRE-PR: a CDK developer pushes a feature
# branch (NOT a PR) and calls mcp-cdk-governance, which synthesizes CDK ->
# CloudFormation, runs the deterministic governance gate, and raises the MR
# ONLY on PASS. A failing change never becomes a PR on the sanctioned path.
#
# THIS pipeline is the REQUIRED MERGE BACKSTOP (defense-in-depth): it re-synths
# and re-scans the MR so any hand-raised / unsanctioned MR that bypassed the
# pre-PR MCP is still blocked before it merges to protected main. In the happy
# path (pre-PR gate already PASSed) it is green.
#   - cdk-synth -> governance-scan  -> required, fail-closed merge check
#   - governance_issue_on_fail      -> files exactly one issue for unsanctioned FAILs
# ============================================================================
stages:
  - synth
  - scan
  - evidence
  - notify

# Auto-retry ONLY transient infra failures (e.g. public.ecr.aws image-pull rate limits).
# Real policy failures are script_failure and are never retried, so the gate stays honest.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TRIVY_VERSION: "0.72.0"
  CONFTEST_VERSION: "0.56.0"

# ----------------------------------------------------------------------------
# 1) Synthesize CDK (Python) -> CloudFormation. We NEVER scan CDK source; we
#    scan the synthesized cdk.out templates so CDK and CFN go through the same gate.
# ----------------------------------------------------------------------------
cdk-synth:
  stage: synth
  image: public.ecr.aws/docker/library/python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gnupg >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - >/dev/null 2>&1
    - apt-get install -y -qq nodejs >/dev/null
    - pip install --quiet -r requirements.txt
    - npm install --global aws-cdk >/dev/null 2>&1
  script:
    - cdk synth --all -o cdk.out -c env=dev -c owner=platform -c costCenter=FE-DEMO
    - ls -1 cdk.out/*.template.json
  artifacts:
    paths: [cdk.out/]
    expire_in: 1 day

# ----------------------------------------------------------------------------
# 2) Governance scan on the synthesized CloudFormation:
#    Governance CSPM (customer-managed KMS) + mandatory tags + region restriction.
# ----------------------------------------------------------------------------
governance-scan:
  stage: scan
  image: public.ecr.aws/docker/library/debian:12-slim
  needs: [cdk-synth]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl tar >/dev/null
    - curl -sL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy
    - curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin conftest
  script:
    - chmod +x governance/scan-cfn.sh
    - governance/scan-cfn.sh cdk.out --json governance-result.json
  artifacts:
    when: always
    paths: [governance-result.json]

# ----------------------------------------------------------------------------
# 3) Governance evidence — MR must carry a ## Governance section.
# ----------------------------------------------------------------------------
governance_evidence:
  stage: evidence
  image: public.ecr.aws/docker/library/alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail
      DESC=$(curl -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
        | jq -r '.description // ""')
      echo "$DESC" | grep -q '## Governance' || {
        echo "FAIL: MR description must include a '## Governance' section"
        exit 1
      }
      echo "OK: governance evidence present"

# ----------------------------------------------------------------------------
# 4) Deterministic FAIL notification: if the governance gate failed, file EXACTLY ONE issue.
#    Runs only on_failure of an earlier stage (cdk-synth infra retried; governance-scan is the gate).
# ----------------------------------------------------------------------------
governance_issue_on_fail:
  stage: notify
  image: public.ecr.aws/docker/library/alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_failure
  before_script:
    - apk add --no-cache curl jq >/dev/null
  script:
    - |
      set -uo pipefail
      : "${GOVERNANCE_ISSUE_TOKEN:?GOVERNANCE_ISSUE_TOKEN not set}"
      MR_URL="${CI_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
      TITLE="Governance scan FAIL: MR !${CI_MERGE_REQUEST_IID}"
      DESC="## Governance gate: FAIL (CDK synthesized to CloudFormation, then scanned)\n\nThe governed pipeline blocked MR [!${CI_MERGE_REQUEST_IID}](${MR_URL}).\n\n- Branch: \`${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}\`\n- Pipeline: ${CI_PIPELINE_URL}\n- Gate: Governance CSPM (customer-managed KMS) + mandatory tags (Owner/CostCenter/Environment) + region us-east-1 only\n\nSee the \`governance-scan\` job log for the exact failing gate(s) and resource(s) on the synthesized \`cdk.out\` templates. Fix and push, or ask Aiden to re-author using the FM building blocks (SecureBucket, DlqQueue)."
      BODY=$(jq -n --arg t "$TITLE" --arg d "$DESC" '{title:$t, description:$d}')
      curl -sS -f -X POST --header "PRIVATE-TOKEN: ${GOVERNANCE_ISSUE_TOKEN}" --header "Content-Type: application/json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues" -d "$BODY" | jq -r '.web_url' || echo "issue create skipped"

# ----------------------------------------------------------------------------
# 4a) Notify Aiden to review (analysis only; CI owns the FAIL issue).
# ----------------------------------------------------------------------------
notify_aiden_mr_governance:
  stage: notify
  image: public.ecr.aws/docker/library/alpine:3.20
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache curl jq git >/dev/null
  script:
    - |
      set -euo pipefail
      if [[ -z "${AIDEN_MR_GOVERNANCE_WEBHOOK_URL:-}" ]]; then
        echo "WARN: AIDEN_MR_GOVERNANCE_WEBHOOK_URL unset — skip Aiden notify"; exit 0
      fi
      CHANGED=$(git diff --name-only "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}}...HEAD" 2>/dev/null | head -80 | jq -R -s -c 'split("\n")|map(select(length>0))' || echo '[]')
      PAYLOAD=$(jq -n \
        --arg project "${CI_PROJECT_PATH}" \
        --arg mr_iid "${CI_MERGE_REQUEST_IID}" \
        --arg mr_url "${CI_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        --arg source_branch "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
        --arg target_branch "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" \
        --arg sha "${CI_COMMIT_SHA}" \
        --arg pipeline "${CI_PIPELINE_URL}" \
        --argjson changed "$CHANGED" \
        '{source:"gitlab-ci",event:"mr_governance_scan",kind:"cdk",project:$project,mr_iid:$mr_iid,mr_url:$mr_url,source_branch:$source_branch,target_branch:$target_branch,sha:$sha,pipeline_url:$pipeline,changed_files:$changed,instruction:"CDK MR — synth to CloudFormation, scan governance (CSPM+tags+region), notify PASS/FAIL, do not deploy."}')
      curl -sS -f -X POST "$AIDEN_MR_GOVERNANCE_WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD" | head -c 500 || true
      echo; echo "OK: notified Aiden MR governance webhook"
  allow_failure: true

# ----------------------------------------------------------------------------
# 4b) Notify Aiden to deploy (post-merge, manual, default branch).
# ----------------------------------------------------------------------------
notify_aiden_deploy:
  stage: notify
  image: public.ecr.aws/docker/library/alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail
      : "${AIDEN_DEPLOY_WEBHOOK_URL:?set CI var}"
      ENV_NAME="${DEPLOY_ENV:-prod}"
      PAYLOAD=$(jq -n \
        --arg project "${CI_PROJECT_PATH}" \
        --arg sha "${CI_COMMIT_SHA}" \
        --arg ref "${CI_COMMIT_REF_NAME}" \
        --arg env "${ENV_NAME}" \
        --arg pipeline "${CI_PIPELINE_URL}" \
        '{source:"gitlab-ci",event:"notify_aiden_deploy",kind:"cdk",project:$project,commit_sha:$sha,ref:$ref,environment:$env,pipeline_url:$pipeline,instruction:"Deploy synthesized cdk.out templates to protected env. Synth CDK->CFN, require ## Governance, deploy via mcp-cfn-deploy. Stack cdk-<stack>-<env>."}')
      HDRS=(-H "Content-Type: application/json")
      [[ -n "${AIDEN_DEPLOY_WEBHOOK_TOKEN:-}" ]] && HDRS+=(-H "Authorization: Bearer ${AIDEN_DEPLOY_WEBHOOK_TOKEN}")
      curl -sS -f -X POST "${AIDEN_DEPLOY_WEBHOOK_URL}" "${HDRS[@]}" -d "${PAYLOAD}"
