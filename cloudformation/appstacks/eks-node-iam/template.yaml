AWSTemplateFormatVersion: '2010-09-09'
Description: Brownfield — IAM roles for field-engineering EKS Auto Mode (cluster + node). Mirrors AmazonEKSAutoClusterRole / AmazonEKSAutoNodeRole with org tags.

Parameters:
  Environment: { Type: String, AllowedValues: [dev, stage, uat, prod] }
  Owner: { Type: String }
  CostCenter: { Type: String }

Resources:
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fe-eks-auto-cluster-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSComputePolicy
        - arn:aws:iam::aws:policy/AmazonEKSBlockStoragePolicy
        - arn:aws:iam::aws:policy/AmazonEKSLoadBalancingPolicy
        - arn:aws:iam::aws:policy/AmazonEKSNetworkingPolicy
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: eks-node-iam }

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fe-eks-auto-node-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodeMinimalPolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: eks-node-iam }

Outputs:
  ClusterRoleArn: { Value: !GetAtt ClusterRole.Arn, Export: { Name: !Sub 'fe-${Environment}-eks-cluster-role' } }
  NodeRoleArn: { Value: !GetAtt NodeRole.Arn, Export: { Name: !Sub 'fe-${Environment}-eks-node-role' } }
