AWSTemplateFormatVersion: '2010-09-09'
Description: Brownfield — IAM for external-dns managing Route53 hosted zone stackgen.run (Z04651531ULS293Y1EQT).

Parameters:
  Environment: { Type: String, AllowedValues: [dev, stage, uat, prod] }
  Owner: { Type: String }
  CostCenter: { Type: String }
  HostedZoneId:
    Type: String
    Default: Z04651531ULS293Y1EQT

Resources:
  ExternalDnsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fe-external-dns-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: route53-zone-limited
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [route53:ChangeResourceRecordSets]
                Resource: !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
              - Effect: Allow
                Action: [route53:ListHostedZones, route53:ListResourceRecordSets, route53:ListTagsForResource]
                Resource: '*'
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: dns-external }

Outputs:
  ExternalDnsRoleArn: { Value: !GetAtt ExternalDnsRole.Arn }
  HostedZoneId: { Value: !Ref HostedZoneId }
