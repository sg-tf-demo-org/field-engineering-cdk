AWSTemplateFormatVersion: '2010-09-09'
Description: Brownfield — ingress platform security group + IAM for internet-facing NLB path (mirrors ingress-nginx NLB on field-engineering).

Parameters:
  Environment: { Type: String, AllowedValues: [dev, stage, uat, prod] }
  Owner: { Type: String }
  CostCenter: { Type: String }
  VpcId: { Type: String, Default: 'USE_NETWORKING_EXPORT' }

Conditions:
  HasRealVpc: !Not [!Equals [!Ref VpcId, 'USE_NETWORKING_EXPORT']]

Resources:
  IngressSG:
    Type: AWS::EC2::SecurityGroup
    Condition: HasRealVpc
    Properties:
      GroupDescription: !Sub 'fe ingress ${Environment} (80/443 from internet)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub 'fe-ingress-sg-${Environment}' }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: ingress-platform }

  # Always-creatable IAM piece for CI lint / lab without VPC dependency
  IngressControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fe-ingress-controller-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elb-limited
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:Describe*
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - ec2:Describe*
                Resource: '*'
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: ingress-platform }

Outputs:
  IngressControllerRoleArn: { Value: !GetAtt IngressControllerRole.Arn }
