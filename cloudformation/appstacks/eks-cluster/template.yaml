AWSTemplateFormatVersion: '2010-09-09'
Description: Brownfield/lab — field-engineering EKS Auto Mode control plane. Live cluster name is field-engineering; lab uses field-engineering-<env>.

Parameters:
  Environment: { Type: String, AllowedValues: [dev, stage, uat, prod] }
  Owner: { Type: String }
  CostCenter: { Type: String }
  KubernetesVersion:
    Type: String
    Default: '1.36'
  PublicAccessCidrs:
    Type: CommaDelimitedList
    Default: '10.0.0.0/8'
    Description: "Must NOT be 0.0.0.0/0 in prod (org governance). Live drift currently world-open; remediate via MR."
  VpcId:
    Type: String
    Description: From networking stack export or live VPC
  SubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for the control plane / nodes
  ClusterRoleArn:
    Type: String
    Description: From eks-node-iam stack export
  NodeRoleArn:
    Type: String
    Description: From eks-node-iam stack export

Resources:
  ClusterSecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'EKS secrets encryption field-engineering-${Environment}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: eks-cluster }

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub 'field-engineering-${Environment}'
      Version: !Ref KubernetesVersion
      RoleArn: !Ref ClusterRoleArn
      AccessConfig:
        AuthenticationMode: API
      ResourcesVpcConfig:
        SubnetIds: !Ref SubnetIds
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs: !Ref PublicAccessCidrs
      Logging:
        ClusterLogging:
          EnabledTypes:
            - { Type: api }
            - { Type: audit }
            - { Type: authenticator }
            - { Type: controllerManager }
            - { Type: scheduler }
      EncryptionConfig:
        - Provider: { KeyArn: !GetAtt ClusterSecretsKey.Arn }
          Resources: [secrets]
      ComputeConfig:
        Enabled: true
        NodePools: [general-purpose, system]
        NodeRoleArn: !Ref NodeRoleArn
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: 10.100.0.0/16
        ElasticLoadBalancing: { Enabled: true }
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: eks-cluster }

  MetricsServerAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: metrics-server
      ClusterName: !Ref Cluster
      ResolveConflicts: OVERWRITE
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: eks-cluster }

Outputs:
  ClusterName: { Value: !Ref Cluster }
  ClusterArn: { Value: !GetAtt Cluster.Arn }
  SecretsKeyArn: { Value: !GetAtt ClusterSecretsKey.Arn }
