AWSTemplateFormatVersion: '2010-09-09'
Description: Brownfield — ECR repositories for field-engineering MCP images (mcp-cfn-deploy, mcp-gitlab, mcp-aws-iac).

Parameters:
  Environment: { Type: String, AllowedValues: [dev, stage, uat, prod] }
  Owner: { Type: String }
  CostCenter: { Type: String }

Resources:
  McpCfnDeploy:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'mcp-cfn-deploy-${Environment}'
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      ImageTagMutability: MUTABLE
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: ecr-mcp }

  McpGitlab:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'mcp-gitlab-${Environment}'
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: ecr-mcp }

  McpAwsIac:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'mcp-aws-iac-${Environment}'
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      Tags:
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: aiden }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: AppStack, Value: ecr-mcp }

Outputs:
  McpCfnDeployUri: { Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${McpCfnDeploy}' }
