AWSTemplateFormatVersion: '2010-09-09'
Description: 'Order Events SQS queue with DLQ, CMK encryption, and standard tags — us-east-1'

Resources:

  OrderEventsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed KMS key for Order Events SQS queues
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSQSServiceUse
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: '*'
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: aiden

  OrderEventsKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/order-events-sqs-key
      TargetKeyId: !Ref OrderEventsKMSKey

  OrderEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: order-events-dlq
      KmsMasterKeyId: !Ref OrderEventsKMSKey
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: aiden

  OrderEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: order-events-queue
      KmsMasterKeyId: !Ref OrderEventsKMSKey
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderEventsDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: aiden

  OrderEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrderEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOwningAccountSendMessage
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource: !GetAtt OrderEventsQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
